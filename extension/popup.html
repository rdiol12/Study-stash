<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Udemy Downloader Bridge</title>
  </head>
  <body>
    <header>
      <h1>Udemy Downloader</h1>
      <span id="health" class="pill pill-wait">checking…</span>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section>
      <div class="engine-row">
        <button id="engineToggle" class="toggle" aria-pressed="false">Docker: off</button>
        <span id="engineState" class="pill">browser only</span>
      </div>
      <p class="hint" id="engineHint"></p>
    </section>

    <section>
      <div id="tabPickWrap" hidden>
        <label for="tabPick">Which course tab <span class="hint-inline" id="tabPickCount"></span></label>
        <select id="tabPick"></select>
      </div>
      <label for="courseUrl">Course URL</label>
      <input id="courseUrl" type="url" placeholder="https://www.udemy.com/course/slug/learn/" />
      <p id="authState" class="hint"></p>
    </section>

    <section>
      <label>Save to</label>
      <div class="dest-row">
        <span id="destPath" class="dest-path">library root</span>
        <button id="btnPick" class="small">Change…</button>
      </div>
      <input id="destSub" type="text" placeholder="Courses" hidden />
      <p class="hint" id="destHint">
        Creates &lt;Course&gt;/01 - Section/001 Lecture.mp4 inside this folder.
      </p>
    </section>

    <section id="picker" hidden>
      <div class="row-between">
        <label style="margin:0">Pick a folder</label>
        <button id="pickerClose" class="link-danger">Close</button>
      </div>
      <p id="pickerPath" class="hint"></p>
      <ul id="pickerList" class="jobs"></ul>
      <div class="actions">
        <input id="newFolderName" type="text" placeholder="New folder name" />
        <button id="btnNewFolder" class="secondary">Create</button>
      </div>
      <div class="actions">
        <button id="btnUseFolder" class="primary">Use this folder</button>
      </div>
    </section>

    <section class="grid2">
      <div>
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="best">Best available</option>
          <option value="2160">2160p</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
      </div>
      <div>
        <label for="concurrent">Concurrent segments</label>
        <input id="concurrent" type="number" min="1" max="30" value="10" />
      </div>
    </section>

    <section class="grid2">
      <div>
        <label for="chapter">Chapters <span class="hint-inline">blank = all</span></label>
        <input id="chapter" type="text" placeholder="1,3-5,7" />
      </div>
      <div>
        <label for="lang">Caption language</label>
        <input id="lang" type="text" placeholder="en or all" value="en" />
      </div>
    </section>

    <section>
      <label>Include</label>
      <div class="checks">
        <label><input type="checkbox" id="download_captions" /> Captions</label>
        <label><input type="checkbox" id="download_assets" /> Assets</label>
        <label><input type="checkbox" id="download_quizzes" /> Quizzes</label>
        <label><input type="checkbox" id="skip_lectures" /> Skip videos</label>
        <label><input type="checkbox" id="keep_vtt" /> Keep .vtt</label>
        <label><input type="checkbox" id="skip_hls" /> Skip HLS</label>
      </div>
    </section>

    <details>
      <summary>Advanced</summary>
      <div class="checks">
        <label><input type="checkbox" id="hd" /> 1080p in browser mode <span class="hint-inline">transmuxes HLS, slower</span></label>
        <label><input type="checkbox" id="send_cookies" /> Use cookies instead of token <span class="hint-inline">try this if auth fails</span></label>
        <label><input type="checkbox" id="subscription_course" /> Force subscription course</label>
        <label><input type="checkbox" id="id_as_course_name" /> Use course ID as folder</label>
        <label><input type="checkbox" id="continue_lecture_numbers" /> Continuous lecture numbers</label>
        <label><input type="checkbox" id="save_to_file" /> Cache course data</label>
        <label><input type="checkbox" id="load_from_file" /> Load cached course data</label>
        <label><input type="checkbox" id="use_h265" /> Re-encode to H.265</label>
        <label><input type="checkbox" id="use_nvenc" /> GPU encode (NVENC)</label>
      </div>
      <p id="nvencHint" class="hint">checking GPU…</p>
      <div class="grid2" id="h265opts" hidden>
        <div>
          <label for="h265_crf" id="crfLabel">Quality (CRF)</label>
          <input id="h265_crf" type="number" min="0" max="51" value="28" />
        </div>
        <div>
          <label for="h265_preset">Preset</label>
          <select id="h265_preset"></select>
        </div>
      </div>
      <div>
        <label for="hd_lanes">Parallel lectures <span class="hint-inline">1080p mode; each uses ~300 MB RAM</span></label>
        <select id="hd_lanes">
          <option value="1">1 (lowest memory)</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4 (fastest, heaviest)</option>
        </select>
      </div>
      <div>
        <label for="log_level">Log level</label>
        <select id="log_level">
          <option>DEBUG</option>
          <option selected>INFO</option>
          <option>WARNING</option>
          <option>ERROR</option>
        </select>
      </div>
    </details>

    <div class="actions">
      <button id="btnInfo" class="secondary">Course info only</button>
      <button id="btnDownload" class="primary">Download</button>
    </div>

    <section id="jobsSection">
      <div class="row-between">
        <label>Jobs</label>
        <span class="row-links">
          <a id="openPlayer" href="#">My courses</a>
          <a id="clearJobs" href="#">Clear finished</a>
          <a id="openOptions" href="#">Settings</a>
        </span>
      </div>
      <ul id="jobs" class="jobs"></ul>
      <div id="jobDetail" hidden>
        <div class="row-between">
          <span id="jobStatus" class="hint"></span>
          <button id="btnCancel" class="link-danger">Cancel</button>
        </div>
        <div id="fileList" class="files" hidden></div>
        <pre id="jobLog"></pre>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
