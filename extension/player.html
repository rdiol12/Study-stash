<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My courses</title>
    <style>
      :root {
        --bg: #1c1d1f; --panel: #2d2f31; --panel2: #3e4143; --line: #3e4143;
        --fg: #fff; --muted: #a6a8ab; --accent: #a435f0; --ok: #5cb85c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        height: 100vh; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 18px; background: var(--panel); border-bottom: 1px solid #000;
        flex: 0 0 auto;
      }
      header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      header a, header button {
        color: var(--fg); background: none; border: 1px solid var(--panel2);
        border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 13px;
        cursor: pointer; text-decoration: none;
      }
      header a:hover, header button:hover { background: var(--panel2); }

      /* ---------- library ---------- */
      #library { padding: 26px; overflow-y: auto; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        overflow: hidden; cursor: pointer;
      }
      .card:hover { border-color: var(--accent); }
      .card .thumb {
        aspect-ratio: 16 / 9; background: linear-gradient(135deg, #3e4143, #1c1d1f);
        display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 34px; font-weight: 700; letter-spacing: 2px;
      }
      .card .thumb img, .card .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .body { padding: 14px 16px 16px; }
      .card h2 { font-size: 15px; margin: 0 0 6px; }
      .card .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
      .bar { height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
      .bar > div { height: 100%; background: var(--accent); }
      .card .pct { font-size: 12px; color: var(--muted); margin-top: 6px; }
      .card .warn { color: #f3ca8c; font-size: 12px; margin-top: 8px; }
      .empty { color: var(--muted); padding: 40px; text-align: center; }

      /* ---------- player ---------- */
      #course { display: none; flex: 1; min-height: 0; }
      #course.active { display: flex; }
      #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #000; }
      /* "Fill" (default) crops a little to use the whole area with no black bars;
         "Fit" shows every pixel for lectures where the edges matter (code, slides) */
      video { width: 100%; flex: 1; min-height: 0; outline: none; background: #000; object-fit: cover; }
      #course.fit-contain video { object-fit: contain; }
      /* centered play/pause icon flashed on toggle, like YouTube's */
      #playFlash {
        position: absolute; left: 50%; top: 45%; z-index: 6; pointer-events: none;
        width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
        background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center;
        opacity: 0;
      }
      #playFlash svg { width: 32px; height: 32px; fill: #fff; }
      #playFlash.show { animation: playFlash .6s ease-out forwards; }
      @keyframes playFlash {
        0% { opacity: 1; transform: scale(.8); }
        100% { opacity: 0; transform: scale(1.4); }
      }
      #videoMsg {
        position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 6;
        max-width: min(560px, 80%); padding: 16px 20px; border-radius: 8px;
        background: rgba(17,22,28,.92); color: #f3ca8c; font-size: 14px; text-align: center;
        white-space: pre-line; overflow-wrap: anywhere;
      }
      /* the purple strip is the seek bar; hide only the native timeline so
         play/volume/fullscreen stay native. Chromium still honours these
         pseudo-element selectors even though the controls are shadow DOM. */
      video::-webkit-media-controls-timeline { display: none; }
      /* fullscreen goes through ours (button, F, double-click), which keeps the
         sidebar and controls; controlslist="nofullscreen" only greys this out */
      video::-webkit-media-controls-fullscreen-button { display: none; }
      video::-webkit-media-controls-current-time-display,
      video::-webkit-media-controls-time-remaining-display { display: inline-block; }

      /* hover-preview seek strip, above the native controls */
      #seekwrap {
        position: relative; flex: 0 0 auto; padding: 8px 14px 4px;
        background: var(--panel);
      }
      #seektrack {
        position: relative; height: 6px; border-radius: 3px;
        background: var(--panel2); cursor: pointer;
        transition: transform 0.1s ease;
      }
      /* scaleY instead of height: transforms don't reflow, so the video above
         no longer jumps when the bar fattens on hover */
      #seektrack:hover { transform: scaleY(1.5); }
      #seekfill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: var(--accent); border-radius: 3px; pointer-events: none;
      }
      #seekpreview {
        position: absolute; bottom: 22px; transform: translateX(-50%);
        display: none; flex-direction: column; align-items: center; gap: 3px;
        pointer-events: none; z-index: 5;
      }
      #seekpreview canvas {
        width: 176px; height: 99px; border-radius: 4px;
        border: 1px solid #000; background: #000;
        box-shadow: 0 4px 14px rgba(0,0,0,.5);
      }
      #seektime {
        font-size: 11.5px; background: rgba(0,0,0,.85); color: #fff;
        padding: 2px 7px; border-radius: 3px; font-variant-numeric: tabular-nums;
      }
      #controls {
        display: flex; align-items: center; gap: 10px; padding: 8px 14px;
        background: var(--panel); flex: 0 0 auto;
      }
      #titleBar {
        flex: 0 0 auto; padding: 9px 16px; background: var(--panel);
        border-bottom: 1px solid #000; font-size: 14px; font-weight: 600;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #course:fullscreen #titleBar { display: none; }
      #controls button, #controls select {
        background: none; border: 1px solid var(--panel2); color: var(--fg);
        border-radius: 4px; padding: 5px 10px; font-size: 12.5px; cursor: pointer;
      }
      #controls button:hover { background: var(--panel2); }
      /* native <select> popups are OS-white; set an explicit dark bg + option
         colors so the dropdown text isn't white-on-white */
      #controls select { background: var(--panel2); color: var(--fg); }
      #controls select option { background: var(--panel); color: var(--fg); }

      aside {
        width: 380px; flex: 0 0 auto; background: var(--panel);
        border-left: 1px solid #000; overflow-y: auto;
      }
      aside h3 {
        margin: 0; padding: 14px 16px; font-size: 14px;
        border-bottom: 1px solid var(--line); position: sticky; top: 0;
        background: var(--panel); z-index: 1;
      }
      #asideToggle {
        position: absolute; top: 8px; right: 8px; z-index: 7;
        width: 30px; height: 30px; border-radius: 6px; border: 0; cursor: pointer;
        background: rgba(17,22,28,.8); color: #e8edf2; font-size: 15px; line-height: 1;
      }
      #asideToggle:hover { background: rgba(17,22,28,.95); }
      #course.aside-hidden aside { display: none; }
      .navArrow {
        position: absolute; top: 50%; transform: translateY(-50%); z-index: 6;
        width: 48px; height: 72px; border: 0; border-radius: 8px; cursor: pointer;
        background: rgba(17,22,28,.55); color: #fff; font-size: 34px; line-height: 1;
        opacity: 0; transition: opacity .6s ease; pointer-events: none;
      }
      .navArrow:hover { background: rgba(17,22,28,.85); }
      #navPrev { left: 14px; }
      #navNext { right: 14px; }
      #course.nav-show .navArrow { opacity: 1; pointer-events: auto; transition: opacity .15s ease; }
      .navArrow.navHidden { display: none; }
      details.section { border-bottom: 1px solid var(--line); }
      details.section > summary {
        list-style: none; cursor: pointer; padding: 12px 16px;
        font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px;
        background: var(--panel);
      }
      details.section > summary:hover { background: var(--panel2); }
      details.section > summary .count { color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
      .item {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 9px 14px 9px 16px; cursor: pointer; font-size: 13px;
      }
      .item:hover { background: var(--panel2); }
      .item.current { background: #4d3a63; }
      .item .tick {
        flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px;
        border: 1px solid var(--muted); border-radius: 2px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 11px; color: #000; background: transparent; cursor: pointer;
      }
      .item.done .tick { background: var(--fg); border-color: var(--fg); }
      .item .label { flex: 1; min-width: 0; }
      .item .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .resources { display: flex; flex-direction: column; gap: 4px; padding: 2px 16px 8px 42px; }
      .res {
        color: var(--muted); font-size: 12px; text-decoration: none;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .res:hover { color: var(--fg); text-decoration: underline; }
      .resBadge {
        flex: 0 0 auto; align-self: center; border: 0; cursor: pointer;
        background: var(--panel2); color: var(--muted); border-radius: 4px;
        padding: 3px 7px; font-size: 11px; margin-left: 6px;
      }
      .resBadge:hover { color: var(--fg); }
      .item.drm { opacity: 0.45; cursor: default; }
      .banner {
        margin: 14px; padding: 10px 12px; border-radius: 6px;
        background: #3b2f1e; border: 1px solid #8a6d3b; color: #f3ca8c; font-size: 12.5px;
        white-space: pre-line;
      }
      .hiddenEl { display: none !important; }
      #stage { position: relative; }
      .cc-group { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
      .cc-group label { color: var(--muted, #9aa6b3); font-size: 12px; }
      #nextPrompt {
        position: absolute; right: 16px; bottom: 90px; z-index: 5;
        display: flex; align-items: center; gap: 10px;
        background: rgba(17,22,28,.92); color: #e8edf2; padding: 10px 14px;
        border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.4); font-size: 13px;
      }
      #nextPrompt button {
        border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
        background: #11698e; color: #fff; font: inherit;
      }
      #nextPrompt #nextPromptCancel { background: #27333d; color: #9aa6b3; }

      /* Fullscreen: the stage fills the screen; our chrome hides until the
         mouse reaches the bottom, then slides up. Esc exits (browser default). */
      /* Fullscreen covers the whole course (stage + sidebar) so the sidebar can
         be opened without leaving fullscreen. Everything hides after 4s idle
         (no .nav-show) and reappears on mouse move. */
      #course:fullscreen { background: #000; cursor: none; }
      #course:fullscreen.nav-show { cursor: default; }
      #course:fullscreen #stage { flex: 1; min-width: 0; }
      #course:fullscreen #video { width: 100%; height: 100%; }
      #course:fullscreen #seekwrap,
      #course:fullscreen #controls,
      #course:fullscreen #asideToggle {
        position: absolute; z-index: 7;
        opacity: 0; transition: opacity .3s ease; pointer-events: none;
      }
      /* stacked above the browser's own 48px control bar, which shows with ours */
      #course:fullscreen #seekwrap { left: 0; right: 0; bottom: 102px; }
      #course:fullscreen #controls { left: 0; right: 0; bottom: 48px; background: rgba(17,22,28,.94); padding: 10px 16px; margin: 0; }
      #course:fullscreen.nav-show #seekwrap,
      #course:fullscreen.nav-show #controls,
      #course:fullscreen.nav-show #asideToggle { opacity: 1; pointer-events: auto; }
      /* above the sidebar overlay (z 8), or the overlay swallows its clicks */
      #course:fullscreen #asideToggle { z-index: 9; }
      #course:fullscreen #nextPrompt { bottom: 124px; }
      /* sidebar becomes an overlay on the right so the video stays full */
      #course:fullscreen aside { position: absolute; right: 0; top: 0; bottom: 0; width: 360px; z-index: 8; box-shadow: -4px 0 16px rgba(0,0,0,.5); }
    </style>
    <style id="capStyle"></style>
  </head>
  <body>
    <header>
      <button id="back" class="hiddenEl">‹ My courses</button>
      <h1 id="title">My courses</h1>
      <a id="openUdemy" href="https://www.udemy.com/home/my-courses/" target="_blank">Udemy</a>
    </header>

    <div id="library"><div class="cards" id="cards"></div></div>

    <div id="course">
      <div id="stage">
        <div id="titleBar"><span id="nowPlaying"></span></div>
        <button id="asideToggle" title="Hide/show course content">»</button>
        <button id="navPrev" class="navArrow" title="Previous lecture">‹</button>
        <button id="navNext" class="navArrow" title="Next lecture">›</button>
        <video id="video" controls controlslist="nofullscreen" preload="metadata"></video>
        <div id="videoMsg" class="hiddenEl"></div>
        <div id="playFlash" aria-hidden="true"></div>
        <div id="seekwrap">
          <div id="seekpreview">
            <canvas id="seekcanvas" width="352" height="198"></canvas>
            <span id="seektime">0:00</span>
          </div>
          <div id="seektrack"><div id="seekfill"></div></div>
        </div>
        <div id="controls">
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <button id="prev">‹ Prev</button>
          <button id="next">Next ›</button>
          <button id="fs" title="Fullscreen (F)">⛶</button>
          <button id="fit" title="Fill the screen or fit the whole picture (Z)">Fill</button>
          <span class="cc-group">
            <label for="capSize">CC</label>
            <select id="capSize" title="Subtitle size">
              <option value="80">Small</option>
              <option value="100" selected>Normal</option>
              <option value="135">Large</option>
              <option value="175">Huge</option>
            </select>
            <select id="capBg" title="Subtitle background">
              <option value="semi" selected>Shadowed</option>
              <option value="box">Box</option>
              <option value="none">None</option>
            </select>
          </span>
        </div>
        <div id="nextPrompt" class="hiddenEl">
          <span id="nextPromptText">Next up</span>
          <button id="nextPromptGo">Play now</button>
          <button id="nextPromptCancel">Cancel</button>
        </div>
      </div>
      <aside>
        <h3>Course content</h3>
        <div id="fileAccessWarn" class="banner hiddenEl"></div>
        <div id="sections"></div>
      </aside>
    </div>

    <script type="module" src="player.js"></script>
  </body>
</html>
