<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My courses</title>
    <style>
      :root {
        --bg: #1c1d1f; --panel: #2d2f31; --panel2: #3e4143; --line: #3e4143;
        --fg: #fff; --muted: #a6a8ab; --accent: #a435f0; --ok: #5cb85c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        height: 100vh; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 18px; background: var(--panel); border-bottom: 1px solid #000;
        flex: 0 0 auto;
      }
      header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      header a, header button {
        color: var(--fg); background: none; border: 1px solid var(--panel2);
        border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 13px;
        cursor: pointer; text-decoration: none;
      }
      header a:hover, header button:hover { background: var(--panel2); }

      /* ---------- library ---------- */
      #library { padding: 26px; overflow-y: auto; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        overflow: hidden; cursor: pointer;
      }
      .card:hover { border-color: var(--accent); }
      .card .thumb {
        aspect-ratio: 16 / 9; background: linear-gradient(135deg, #3e4143, #1c1d1f);
        display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 34px; font-weight: 700; letter-spacing: 2px;
      }
      .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .body { padding: 14px 16px 16px; }
      .card h2 { font-size: 15px; margin: 0 0 6px; }
      .card .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
      .bar { height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
      .bar > div { height: 100%; background: var(--accent); }
      .card .pct { font-size: 12px; color: var(--muted); margin-top: 6px; }
      .card .warn { color: #f3ca8c; font-size: 12px; margin-top: 8px; }
      .empty { color: var(--muted); padding: 40px; text-align: center; }

      /* ---------- player ---------- */
      #course { display: none; flex: 1; min-height: 0; }
      #course.active { display: flex; }
      #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #000; }
      video { width: 100%; flex: 1; min-height: 0; outline: none; background: #000; }
      /* the purple strip is the seek bar; hide only the native timeline so
         play/volume/fullscreen stay native. Chromium still honours these
         pseudo-element selectors even though the controls are shadow DOM. */
      video::-webkit-media-controls-timeline { display: none; }
      video::-webkit-media-controls-current-time-display,
      video::-webkit-media-controls-time-remaining-display { display: inline-block; }

      /* hover-preview seek strip, above the native controls */
      #seekwrap {
        position: relative; flex: 0 0 auto; padding: 8px 14px 4px;
        background: var(--panel);
      }
      #seektrack {
        position: relative; height: 6px; border-radius: 3px;
        background: var(--panel2); cursor: pointer;
        transition: transform 0.1s ease;
      }
      /* scaleY instead of height: transforms don't reflow, so the video above
         no longer jumps when the bar fattens on hover */
      #seektrack:hover { transform: scaleY(1.5); }
      #seekfill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: var(--accent); border-radius: 3px; pointer-events: none;
      }
      #seekpreview {
        position: absolute; bottom: 22px; transform: translateX(-50%);
        display: none; flex-direction: column; align-items: center; gap: 3px;
        pointer-events: none; z-index: 5;
      }
      #seekpreview canvas {
        width: 176px; height: 99px; border-radius: 4px;
        border: 1px solid #000; background: #000;
        box-shadow: 0 4px 14px rgba(0,0,0,.5);
      }
      #seektime {
        font-size: 11.5px; background: rgba(0,0,0,.85); color: #fff;
        padding: 2px 7px; border-radius: 3px; font-variant-numeric: tabular-nums;
      }
      #controls {
        display: flex; align-items: center; gap: 10px; padding: 8px 14px;
        background: var(--panel); flex: 0 0 auto;
      }
      #nowPlaying { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #controls button, #controls select {
        background: none; border: 1px solid var(--panel2); color: var(--fg);
        border-radius: 4px; padding: 5px 10px; font-size: 12.5px; cursor: pointer;
      }
      #controls button:hover { background: var(--panel2); }

      aside {
        width: 380px; flex: 0 0 auto; background: var(--panel);
        border-left: 1px solid #000; overflow-y: auto;
      }
      aside h3 {
        margin: 0; padding: 14px 16px; font-size: 14px;
        border-bottom: 1px solid var(--line); position: sticky; top: 0;
        background: var(--panel); z-index: 1;
      }
      details.section { border-bottom: 1px solid var(--line); }
      details.section > summary {
        list-style: none; cursor: pointer; padding: 12px 16px;
        font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px;
        background: var(--panel);
      }
      details.section > summary:hover { background: var(--panel2); }
      details.section > summary .count { color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
      .item {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 9px 14px 9px 16px; cursor: pointer; font-size: 13px;
      }
      .item:hover { background: var(--panel2); }
      .item.current { background: #4d3a63; }
      .item .tick {
        flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px;
        border: 1px solid var(--muted); border-radius: 2px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 11px; color: #000; background: transparent; cursor: pointer;
      }
      .item.done .tick { background: var(--fg); border-color: var(--fg); }
      .item .label { flex: 1; min-width: 0; }
      .item .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .item.drm { opacity: 0.45; cursor: default; }
      .item.drm .sub a { color: var(--fg); }
      .banner {
        margin: 14px; padding: 10px 12px; border-radius: 6px;
        background: #3b2f1e; border: 1px solid #8a6d3b; color: #f3ca8c; font-size: 12.5px;
        white-space: pre-line;
      }
      .hiddenEl { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <button id="back" class="hiddenEl">‹ My courses</button>
      <h1 id="title">My courses</h1>
      <a id="openUdemy" href="https://www.udemy.com/home/my-courses/" target="_blank">Udemy</a>
    </header>

    <div id="library"><div class="cards" id="cards"></div></div>

    <div id="course">
      <div id="stage">
        <video id="video" controls preload="metadata"></video>
        <div id="seekwrap">
          <div id="seekpreview">
            <canvas id="seekcanvas" width="352" height="198"></canvas>
            <span id="seektime">0:00</span>
          </div>
          <div id="seektrack"><div id="seekfill"></div></div>
        </div>
        <div id="controls">
          <span id="nowPlaying"></span>
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <button id="prev">‹ Prev</button>
          <button id="next">Next ›</button>
        </div>
      </div>
      <aside>
        <h3>Course content</h3>
        <div id="fileAccessWarn" class="banner hiddenEl"></div>
        <div id="sections"></div>
      </aside>
    </div>

    <script type="module" src="player.js"></script>
  </body>
</html>
