<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Keyframe — DRM downloads</title>
    <style>
      body { width: auto; max-width: 820px; margin: 0 auto; padding: 16px; }
      .bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: #2563eb; width: 0; transition: width .3s; }
      .job { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin: 8px 0; }
      .job .top { display: flex; justify-content: space-between; gap: 8px; }
      .job .meta { font-size: 12px; color: #6b7280; margin: 4px 0; }
      .st-done { color: #16a34a; } .st-failed { color: #b91c1c; } .st-running { color: #2563eb; }
      .st-queued, .st-paused, .st-resolving { color: #a16207; }
      .pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .muted { color: #6b7280; font-size: 12px; }
      fieldset { border: 1px solid #e5e7eb; border-radius: 8px; margin: 10px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Keyframe</h1>
      <span class="pills">
        <span id="pBridge" class="pill pill-wait">bridge…</span>
        <span id="pEngine" class="pill pill-wait">engine…</span>
        <span id="pCdm" class="pill pill-wait">CDM…</span>
      </span>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section>
      <div class="actions">
        <button id="btnSetup" class="primary">Set up engine</button>
        <button id="btnUpdate" class="secondary">Update engine</button>
        <button id="btnCdm" class="secondary">Re-check CDM</button>
        <label class="secondary" for="wvdFile" style="cursor:pointer">Load .wvd…</label>
        <input id="wvdFile" type="file" accept=".wvd,.prd" hidden />
      </div>
      <p class="hint" id="setupHint">Standalone — the Widevine CDM, decryption and muxing run in this extension. Load your own <code>.wvd</code> device file.</p>
    </section>

    <fieldset>
      <legend>Download</legend>
      <label for="url">Stream / page URL</label>
      <input id="url" type="url" placeholder="https://… .mpd / .m3u8 / page" />
      <div class="grid2">
        <div>
          <label for="title">Title <span class="hint-inline">for the library card</span></label>
          <input id="title" type="text" placeholder="My Movie" />
        </div>
        <div>
          <label for="authHost">Auth from cookies of <span class="hint-inline">optional host</span></label>
          <input id="authHost" type="text" placeholder="example.com" />
        </div>
      </div>
      <label><input type="checkbox" id="drm" /> DRM protected (resolve keys first)</label>
      <div id="drmOpts" hidden>
        <label for="licenseUrl">License server URL</label>
        <input id="licenseUrl" type="url" placeholder="https://…/license" />
      </div>
      <details>
        <summary>Provider search (instead of a URL)</summary>
        <div class="grid2">
          <div><label for="service">Service</label><input id="service" type="text" placeholder="streamingcommunity" /></div>
          <div><label for="search">Search</label><input id="search" type="text" placeholder="title to find" /></div>
          <div><label for="season">Season</label><input id="season" type="text" placeholder="1 or 1-3 or *" /></div>
          <div><label for="episode">Episode</label><input id="episode" type="text" placeholder="1 or * " /></div>
        </div>
      </details>
      <div class="actions">
        <button id="btnDownload" class="primary">Download</button>
        <button id="btnWatch" class="secondary">Add to watchlist</button>
      </div>
    </fieldset>

    <p class="hint">Downloads and their progress now live in the main extension popup — this page is just the DRM engine &amp; CDM setup.</p>

    <script type="module" src="keyframe-ui.js"></script>
  </body>
</html>
